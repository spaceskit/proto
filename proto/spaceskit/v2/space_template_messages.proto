syntax = "proto3";

package spaceskit.v2;

import "google/protobuf/timestamp.proto";
import "spaceskit/v2/artifact_types.proto";
import "spaceskit/v2/common.proto";
import "spaceskit/v2/space_types.proto";

message TemplateAgentDefinition {
  string agent_id = 1;
  string profile_id = 2;
  CoordinatorRole role = 3;
  int32 turn_order = 4;
  bool is_primary = 5;
}

message SpaceTemplateSummary {
  string template_id = 1;
  string title = 2;
  string communication_mode = 3;
  ConversationTopology conversation_topology = 4;
  string prompt_pack_id = 5;
  repeated string agent_preset_ids = 6;
  string created_by = 7;
  google.protobuf.Timestamp updated_at = 8;
  string category = 9;
  string complexity_tier = 10;
  string icon = 11;
  bool featured = 12;
  int32 sort_order = 13;
  string description = 14;
  int32 agent_count = 15;
}

message PreviewSpaceTemplateRequest {
  string api_version = 1;
  string template_id = 2;
  string resource_id = 3;
  string name = 4;
  string goal = 5;
}

message PreviewSpaceTemplateResolved {
  string template_id = 1;
  int32 template_revision = 2;
  string name = 3;
  string goal = 4;
  string resource_id = 5;
  string communication_mode = 6;
  TurnModelStrategy turn_model = 7;
  ConversationTopology conversation_topology = 8;
  string prompt_pack_id = 9;
  repeated TemplateAgentDefinition initial_agents = 10;
}

message PreviewSpaceTemplateResponse {
  string api_version = 1;
  SpaceTemplateSummary template = 2;
  PreviewSpaceTemplateResolved resolved = 3;
  repeated string warnings = 4;
}

message CreateSpaceFromTemplateRequest {
  string api_version = 1;
  string template_id = 2;
  string space_id = 3;
  string resource_id = 4;
  string name = 5;
  string goal = 6;
  string visibility = 7;
  string idempotency_key = 8;
  optional string workspace_root = 9;
}

message CreateSpaceFromTemplateResponse {
  string api_version = 1;
  SpaceTemplateSummary template = 2;
  SpaceState space = 3;
}

message SaveSpaceTemplateRequest {
  string api_version = 1;
  string template_id = 2;
  string title = 3;
  string description = 4;
  string communication_mode = 5;
  ConversationTopology conversation_topology = 6;
  string prompt_pack_id = 7;
  repeated TemplateAgentDefinition base_agents = 8;
  repeated string agent_preset_ids = 9;
  string source_space_id = 10;
  repeated string tags = 11;
}

message SaveSpaceTemplateResponse {
  string api_version = 1;
  SpaceTemplateSummary template = 2;
  bool created = 3;
}

message SpaceTurn {
  string turn_id = 1;
  string root_turn_id = 2;
  string reply_to_turn_id = 3;
  string agent_id = 4;
  string status = 5;
  string input_text = 6;
  string output_text = 7;
  ConversationTopology conversation_topology = 8;
  TranscriptVisibility transcript_visibility = 9;
  string summary_turn_id = 10;
  TurnExecutionMode execution_mode = 11;
  ReasoningEffort reasoning_effort = 12;
  int32 prompt_tokens = 13;
  int32 completion_tokens = 14;
  int32 total_tokens = 15;
  google.protobuf.Timestamp created_at = 16;
  google.protobuf.Timestamp completed_at = 17;
  ContentEnvelope input_content = 18;
  ContentEnvelope output_content = 19;
}

message ListSpaceTurnsRequest {
  string api_version = 1;
  string space_id = 2;
  int32 limit = 3;
  int32 offset = 4;
  string last_seen_turn_id = 5;
}

message ListSpaceTurnsResponse {
  string api_version = 1;
  string space_id = 2;
  repeated SpaceTurn turns = 3;
  int32 total = 4;
  optional int32 next_offset = 5;
}

// ---------------------------------------------------------------------------
// Session continuity
// ---------------------------------------------------------------------------

message ResumableSession {
  string session_id = 1;
  string space_id = 2;
  string space_name = 3;
  google.protobuf.Timestamp last_activity_at = 4;
  string continuity_mode = 5;
  uint32 turn_count = 6;
}

message ListResumableSessionsRequest {
  string api_version = 1;
}

message ListResumableSessionsResponse {
  string api_version = 1;
  repeated ResumableSession sessions = 2;
}

message ResumeSessionRequest {
  string api_version = 1;
  string session_id = 2;
  string space_id = 3;
}

message ResumeSessionResponse {
  string api_version = 1;
  bool resumed = 2;
  optional string checkpoint_id = 3;
  optional string last_turn_id = 4;
}
